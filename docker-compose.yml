services:
  db:
    image: postgres
    ports:
      - 5434:5432
    volumes:
      - data:/var/lib/postgres
    environment:
      - POSTGRES_PASSWORD=devuser
      - POSTGRES_USER=devuser
      - POSTGRES_DB=student_service
    restart: always
    container_name: db
  backend:
    image: student-service:1.2
    ports:
      - 8085:8085
    environment:
      - DEV_PASSWORD=devuser
      - DEV_USERNAME=devuser
      - DEV_DB_URL_DOCKER=jdbc:postgresql://db:5432/student_service
    restart: always
volumes:
  data:
    driver: local